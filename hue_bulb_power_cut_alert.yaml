blueprint:
  name: Notify Me When Someone Turns Light Switch Off (Philips Hue Bulbs)
  description: >
    Automation that alerts you when a light has lost mains power - almost always because
    somebody flipped the wall switch off on their way out of the room. The bulb is
    then dead to the hub, so motion, schedules and voice commands all silently do
    nothing and the room stays dark until a human notices the switch.  Turning the switch on at that
    point could cause the lights to go to an unwanted state.


    ## <font color="#03a9f4" size="5">What to pick</font>


    Choose **one bulb** on the switched circuit. Any single bulb is enough, since
    every bulb on that circuit shares the switch. The automation watches that entity
    and tells you when it stops being reachable.


    If you run Philips Hue through the Hue bridge, you can also point this at a
    bulb's **Zigbee Connectivity** sensor instead of the light itself. That entity
    reports `connected` / `disconnected` / `connectivity_issue` and is the more
    dependable signal on a Hue setup. It is disabled by default, so you have to turn
    it on first: Settings -> Devices & Services -> Hue -> the bulb's device -> the
    "+N entities not shown" link -> "Zigbee Connectivity" -> gear icon -> Enabled ->
    Update. Give it about 30 seconds to appear. Entirely optional - the blueprint
    works either way.


    Avoid picking a room, zone or group. Those stay "available" no matter what
    happens to the bulbs inside them, so they can never tell you about this.


    ## <font color="#03a9f4" size="5">More than one switch</font>


    Create one automation from this blueprint per switch you want watched. Each gets
    its own name, another "canary" bulb connected to a different switch to monitor
    (used to determine if the physical switch was flipped off or the entire house
    has no power), the alert recipients, and reminder schedule.  There is no limit on
    how many automations you can add from this Blueprint.


    ## <font color="#03a9f4" size="5">Why a canary is worth setting</font>


    If the hub, your network or the whole house's power drops, every bulb becomes
    unreachable at once - and that is not a wall switch. A canary is any bulb
    somewhere else in the house, on a circuit that is not normally switched off. If
    the canary has stopped answering too, the alert is held back, because the problem
    is bigger than one switch.

  domain: automation
  author: Fiendishly
  homeassistant:
    min_version: '2024.10.0'
  input:
    bulbs_section:
      name: Bulbs to Monitor
      icon: mdi:lightbulb-alert
      input:
        monitored_entity:
          name: Bulb to monitor
          description: >
            One bulb on the switched circuit - either the light itself, or that
            bulb's Zigbee Connectivity sensor if you use Hue and have enabled it.
            Do not pick a room, zone or group: they never report as unreachable.
          selector:
            entity: {}
        switch_name:
          name: Name of Light Switch
          description: >
            Used as the title of the alert, as "<name> Is OFF!". Leave blank and it
            uses the bulb's own name followed by "Switch" - for example "Bathroom 1
            Switch". Type your own if you would rather it read "Guest Bathroom" or
            "Hall Switch".
          default: ''
          selector:
            text:
        canary_bulbs:
          name: Canary Bulb
          description: >
            Optional - but highly recommended. Select one or more bulbs located
            elsewhere in the house, on a different light switch that is not normally
            switched off. If the hub or your network goes down, everything becomes
            unreachable at once - if no canary is answering either, the alert is held
            back as a hub or power problem, rather than a wall switch. Leave empty to
            skip the check.
          default: []
          selector:
            entity:
              multiple: true
        settle_time:
          name: Confirm for
          description: >
            How long the bulb must stay unreachable before you are told. Rides out
            brief mesh hiccups and hub restarts. Two minutes suits most homes.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
    alerts_section:
      name: Alert Options
      icon: mdi:bell-alert
      input:
        notify_targets:
          name: Who to notify
          description: >
            One or more notify entities - typically the Home Assistant companion app
            on each phone that should hear about this. Add as many as you like.
          selector:
            entity:
              filter:
              - domain: notify
              multiple: true
        repeat_enabled:
          name: Keep reminding me
          description: >
            Off means one alert per switch-off. On means it nags on the interval
            below until the switch goes back on - which is usually what you want,
            since the first alert tends to arrive when you cannot act on it.
          default: true
          selector:
            boolean:
        repeat_interval:
          name: Remind me every
          default:
            hours: 1
            minutes: 0
            seconds: 0
          selector:
            duration:
        repeat_start:
          name: Only remind me after
          description: >
            Start of the reminder window. Outside the window you still get the very
            first alert - you just are not nagged again until the window reopens.
          default: '08:00:00'
          selector:
            time:
        repeat_end:
          name: And stop reminding me at
          description: >
            End of the reminder window. Set it equal to or earlier than the start
            time to mean "until midnight".  This can prevent multiple notifications
            overnight while you sleep.
          default: '00:00:00'
          selector:
            time:

mode: parallel
max: 10

triggers:
- id: bulb_lost_power
  alias: The bulb stopped answering
  trigger: state
  entity_id: !input monitored_entity
  to:
  - unavailable
  - disconnected
  - connectivity_issue
  - unidirectional_incoming
  for: !input settle_time
- id: setup_check
  alias: Sanity-check the setup on start
  trigger: homeassistant
  event: start
- id: setup_check
  alias: Sanity-check the setup on reload
  trigger: event
  event_type: automation_reloaded

conditions: []

actions:
- alias: Work out the switch name and gather the settings
  variables:
    monitored: !input monitored_entity
    name_input: !input switch_name
    canary: !input canary_bulbs
    notify_targets: !input notify_targets
    repeat_enabled: !input repeat_enabled
    repeat_start: !input repeat_start
    repeat_end: !input repeat_end
    repeat_interval: !input repeat_interval
    unreachable_states:
    - unavailable
    - disconnected
    - connectivity_issue
    - unidirectional_incoming
    switch_name: >-
      {% if name_input %}
        {{ name_input }}
      {% else %}
        {% set d = device_id(monitored) %}
        {% if d %}
          {{ (device_attr(d, 'name_by_user') or device_attr(d, 'name')) ~ ' Switch' }}
        {% else %}
          {{ state_attr(monitored, 'friendly_name') or 'Light' }}
        {% endif %}
      {% endif %}
    interval_seconds: >-
      {{ ((repeat_interval.hours | default(0)) * 3600
          + (repeat_interval.minutes | default(0)) * 60
          + (repeat_interval.seconds | default(0))) | int }}
- choose:
  - alias: Setup check - the chosen entity is no longer there
    conditions:
    - condition: trigger
      id: setup_check
    - alias: The entity has been removed, renamed, or never existed
      condition: template
      value_template: >-
        {{ monitored == '' or states(monitored) in ['unknown', 'None'] }}
    sequence:
    - alias: Say plainly that it is not working
      action: notify.send_message
      target:
        entity_id: !input notify_targets
      data:
        title: '{{ switch_name }} alert is NOT active'
        message: >-
          This automation cannot work right now. The entity it watches ({{ monitored
          if monitored else 'none selected' }}) is not reporting - it has been
          removed, renamed, or disabled. Pick it again in the automation's settings,
          then reload automations. Until then you will not be told when this switch
          is turned off.
  - alias: The bulb lost power - alert, and keep reminding if asked
    conditions:
    - condition: trigger
      id: bulb_lost_power
    - alias: >-
        Hold the alert back if the canaries have stopped answering too, because that
        means the hub, the network or the whole house is down rather than one switch.
      condition: template
      value_template: >-
        {% set ns = namespace(alive=0) %}
        {% for c in canary %}
          {% if states(c) not in unreachable_states %}
            {% set ns.alive = ns.alive + 1 %}
          {% endif %}
        {% endfor %}
        {{ canary | count == 0 or ns.alive > 0 }}
    sequence:
    - alias: Alert now, then nag on the chosen interval until the switch is back on
      repeat:
        sequence:
        - alias: Send the alert
          action: notify.send_message
          target:
            entity_id: !input notify_targets
          data:
            title: '{{ switch_name }} Is OFF!'
            message: >-
              The wall switch for {{ switch_name }} has been turned off, so the bulbs
              there have no power and motion will not turn them on.
        - alias: Wait for the next reminder slot, cut short the moment power returns
          if:
          - alias: Only wait around if reminders are switched on
            condition: template
            value_template: '{{ repeat_enabled }}'
          then:
          - wait_template: >-
              {{ states(monitored) not in unreachable_states }}
            timeout: >-
              {% set n = now() %}
              {% set st = today_at(repeat_start) %}
              {% set en = today_at(repeat_end) %}
              {% set en = en + timedelta(days=1) if en <= st else en %}
              {% if st <= n < en %}
                {{ interval_seconds }}
              {% else %}
                {{ ((st if n < st else st + timedelta(days=1)) - n).total_seconds() | int }}
              {% endif %}
            continue_on_timeout: true
        until:
        - alias: Stop when the bulb is reachable again, or when not repeating
          condition: template
          value_template: >-
            {{ states(monitored) not in unreachable_states or not repeat_enabled }}
